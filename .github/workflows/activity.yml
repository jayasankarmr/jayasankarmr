name: Build activity panel

on:
  schedule:
    # Daily at 00:30 UTC.
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build_activity.py
      - scripts/build_assets.py
      - scripts/svg_kit.py
      - scripts/tokens.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Contribution calendar, streaks and language bytes from the GraphQL API.
      - name: Build activity SVGs
        run: python scripts/build_activity.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes to the `output` branch so the daily refresh never lands in main's
      # history. The README points at raw.githubusercontent.com/.../output/activity-*.svg.
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update activity panel"
          author: "Jayasankar M R <jayasankar.mr7@gmail.com>"
          committer: "Jayasankar M R <jayasankar.mr7@gmail.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
