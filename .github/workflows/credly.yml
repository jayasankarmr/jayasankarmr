name: Sync Credly badges

on:
  schedule:
    # Mondays at 02:00 UTC.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rewrites the region between the START_SECTION:credly / END_SECTION:credly markers.
      - name: Rebuild Certifications from Credly
        run: python .github/scripts/credly.py

      # Commits only when a badge was actually added, removed or changed, so this
      # stays silent almost every week.
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No badge changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Credly badges"
          git push
