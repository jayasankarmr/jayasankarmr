<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="warm-pool-governor: a Lambda polls CloudWatch CPU every minute and sets the Auto Scaling warm pool to one of three phases">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
</defs>
<text x="40" y="26" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">CONTROL LOOP</text>
<text x="840" y="26" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">two reads, zero writes in steady state</text>

  <rect x="355" y="40" width="170" height="44" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="440.0" y="58.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">EventBridge</text>
  <text x="440.0" y="77.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#59636e"></text>
<text x="440" y="76" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#59636e">rate(1 minute)</text>
<line x1="440" y1="84" x2="440" y2="116" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="118" width="200" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="140.0" y="146.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">CloudWatch</text>
  <text x="140.0" y="165.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#59636e">CPU · Maximum / 60 s</text>
<rect x="330" y="118" width="220" height="64" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
<text x="440" y="146" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Lambda · <tspan font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" fill="#0969da">decide(cpu)</tspan></text>
<text x="440" y="165" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#59636e">pure · O(1) · no I/O</text>

  <rect x="640" y="118" width="200" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="740.0" y="146.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Auto Scaling group</text>
  <text x="740.0" y="165.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#59636e">in service ⇄ warm pool</text>
<line x1="240" y1="150" x2="328" y2="150" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="284" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#59636e">GetMetricData</text>
<line x1="550" y1="150" x2="638" y2="150" stroke="#0969da" stroke-width="1.75" marker-end="url(#b)"/>
<text x="594" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#0969da">PutWarmPool</text>
<text x="594" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#59636e">if changed</text>
<path d="M740 182 V206 Q740 214 732 214 H500 M380 214 H148 Q140 214 140 206 V184" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="440" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#59636e">CPUUtilization</text>
<text x="40" y="254" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">PHASE, CHOSEN FROM ONE NUMBER</text>
<rect x="40" y="266" width="800" height="8" rx="4" fill="#eaeef2"/>
<rect x="40.0" y="266" width="160.0" height="8" rx="4" fill="#1a7f37"/>
<rect x="201.0" y="266" width="159.0" height="8" rx="0" fill="#9a6700"/>
<rect x="361.0" y="266" width="479.0" height="8" rx="4" fill="#cf222e"/>
<text x="40.0" y="290" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#59636e">0%</text>
<text x="200.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#59636e">20%</text>
<line x1="200.0" y1="262" x2="200.0" y2="278" stroke="#1f2328" stroke-width="1.25"/>
<text x="360.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#59636e">40%</text>
<line x1="360.0" y1="262" x2="360.0" y2="278" stroke="#1f2328" stroke-width="1.25"/>
<text x="840.0" y="290" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#59636e">100%</text>
<text x="40.0" y="312" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#1a7f37">COST_SAVING</text>
<text x="40.0" y="330" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">drain the pool</text>
<rect x="40.0" y="342" width="16" height="16" rx="3" fill="#1a7f37"/>
<text x="212.0" y="312" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#9a6700">PRE_WARM</text>
<text x="212.0" y="330" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">boot 2 off-traffic</text>
<rect x="212.0" y="342" width="16" height="16" rx="3" fill="#9a6700"/><rect x="234.75" y="342.75" width="14.5" height="14.5" rx="3" fill="none" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="256.75" y="342.75" width="14.5" height="14.5" rx="3" fill="none" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="372.0" y="312" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#cf222e">MITIGATE</text>
<text x="372.0" y="330" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">pull warm into service, re-prepare behind</text>
<rect x="372.0" y="342" width="16" height="16" rx="3" fill="#cf222e"/><rect x="394.0" y="342" width="16" height="16" rx="3" fill="#cf222e"/><rect x="416.75" y="342.75" width="14.5" height="14.5" rx="3" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="438.75" y="342.75" width="14.5" height="14.5" rx="3" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="3 2"/>
<rect x="480.0" y="345" width="10" height="10" rx="2" fill="#59636e"/>
<text x="496.0" y="354" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">in service</text>
<rect x="566.75" y="345.75" width="8.5" height="8.5" rx="2" fill="none" stroke="#59636e" stroke-width="1.25" stroke-dasharray="2.5 1.5"/>
<text x="582.0" y="354" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">warm, stopped (EBS only)</text>
</svg>
