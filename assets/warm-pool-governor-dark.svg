<text x="440" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#9198a1">CPUUtilization</text>
<text x="40" y="254" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">PHASE, CHOSEN FROM ONE NUMBER</text>
<rect x="40" y="266" width="800" height="8" rx="4" fill="#262c36"/>
<rect x="40.0" y="266" width="160.0" height="8" rx="4" fill="#3fb950"/>
<rect x="201.0" y="266" width="159.0" height="8" rx="0" fill="#d29922"/>
<rect x="361.0" y="266" width="479.0" height="8" rx="4" fill="#f85149"/>
<text x="40.0" y="290" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#9198a1">0%</text>
<text x="200.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#9198a1">20%</text>
<line x1="200.0" y1="262" x2="200.0" y2="278" stroke="#e6edf3" stroke-width="1.25"/>
<text x="360.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#9198a1">40%</text>
<line x1="360.0" y1="262" x2="360.0" y2="278" stroke="#e6edf3" stroke-width="1.25"/>
<text x="840.0" y="290" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#9198a1">100%</text>
<text x="40.0" y="312" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#3fb950">COST_SAVING</text>
<text x="40.0" y="330" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">drain the pool</text>
<rect x="40.0" y="342" width="16" height="16" rx="3" fill="#3fb950"/>
<text x="212.0" y="312" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#d29922">PRE_WARM</text>
<text x="212.0" y="330" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">boot 2 off-traffic</text>
<rect x="212.0" y="342" width="16" height="16" rx="3" fill="#d29922"/><rect x="234.75" y="342.75" width="14.5" height="14.5" rx="3" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="256.75" y="342.75" width="14.5" height="14.5" rx="3" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="372.0" y="312" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#f85149">MITIGATE</text>
<text x="372.0" y="330" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">pull warm into service, re-prepare behind</text>
<rect x="372.0" y="342" width="16" height="16" rx="3" fill="#f85149"/><rect x="394.0" y="342" width="16" height="16" rx="3" fill="#f85149"/><rect x="416.75" y="342.75" width="14.5" height="14.5" rx="3" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="438.75" y="342.75" width="14.5" height="14.5" rx="3" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3 2"/>
<rect x="480.0" y="345" width="10" height="10" rx="2" fill="#9198a1"/>
<text x="496.0" y="354" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9198a1">in service</text>
<rect x="566.75" y="345.75" width="8.5" height="8.5" rx="2" fill="none" stroke="#9198a1" stroke-width="1.25" stroke-dasharray="2.5 1.5"/>
<text x="582.0" y="354" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9198a1">warm, stopped (EBS only)</text>
</svg>
