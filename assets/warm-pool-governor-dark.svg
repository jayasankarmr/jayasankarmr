<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="warm-pool-governor: a Lambda polls CloudWatch CPU every minute and sets the Auto Scaling warm pool to one of three phases">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#656c76"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#4493f8"/></marker>
</defs>
<text x="40" y="26" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">CONTROL LOOP</text>
<text x="840" y="26" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">two reads, zero writes in steady state</text>

  <rect x="355" y="40" width="170" height="44" rx="10" fill="#151b23" stroke="#3d444d"/>
  <text x="440.0" y="58.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">EventBridge</text>
  <text x="440.0" y="77.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#9198a1"></text>
<text x="440" y="76" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#9198a1">rate(1 minute)</text>
<line x1="440" y1="84" x2="440" y2="116" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="118" width="200" height="64" rx="10" fill="#151b23" stroke="#3d444d"/>
  <text x="140.0" y="146.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">CloudWatch</text>
  <text x="140.0" y="165.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#9198a1">CPU · Maximum / 60 s</text>
<rect x="330" y="118" width="220" height="64" rx="10" fill="#151b23" stroke="#4493f8" stroke-width="1.5"/>
<text x="440" y="146" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Lambda · <tspan font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" fill="#4493f8">decide(cpu)</tspan></text>
<text x="440" y="165" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#9198a1">pure · O(1) · no I/O</text>

  <rect x="640" y="118" width="200" height="64" rx="10" fill="#151b23" stroke="#3d444d"/>
  <text x="740.0" y="146.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Auto Scaling group</text>
  <text x="740.0" y="165.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#9198a1">in service ⇄ warm pool</text>
<line x1="240" y1="150" x2="328" y2="150" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="284" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#9198a1">GetMetricData</text>
<line x1="550" y1="150" x2="638" y2="150" stroke="#4493f8" stroke-width="1.75" marker-end="url(#b)"/>
<text x="594" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4493f8">PutWarmPool</text>
<text x="594" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#9198a1">if changed</text>
