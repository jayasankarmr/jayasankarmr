<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 250" width="1660" height="500" role="img" aria-label="Control loop: EventBridge triggers a Lambda every minute; it reads CPU from CloudWatch, picks COST_SAVING (under 20%), PRE_WARM (20–40%) or MITIGATE (40% and up), and writes the warm pool size to the Auto Scaling group only when it changes.">
<title>Control loop: EventBridge triggers a Lambda every minute; it reads CPU from CloudWatch, picks COST_SAVING (under 20%), PRE_WARM (20–40%) or MITIGATE (40% and up), and writes the warm pool size to the Auto Scaling group only when it changes.</title>
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A6053"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A15606"/></marker></defs>
<text x="20" y="14" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.54" fill="#6A6053">CONTROL LOOP</text>
<text x="810" y="14" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#6A6053">two reads, zero writes in steady state</text>
<rect x="333.5" y="26.5" width="163" height="39" fill="#FAF6EE" stroke="#D6CCBB"/>
<text x="415" y="42" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1C1712">EventBridge</text>
<text x="415" y="58" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#6A6053">rate(1 minute)</text>
<line x1="415" y1="66" x2="415" y2="84" stroke="#6A6053" stroke-width="1.25" marker-end="url(#am)"/>
<rect x="20.5" y="86.5" width="179" height="51" fill="#FAF6EE" stroke="#D6CCBB" stroke-width="1"/>
<text x="110" y="108" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1C1712">CloudWatch</text>
<text x="110" y="126" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#6A6053">CPU · Maximum / 60 s</text>
<rect x="310.5" y="86.5" width="209" height="51" fill="#FAF6EE" stroke="#A15606" stroke-width="1.5"/>
<text x="415" y="108" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1C1712">Lambda · <tspan fill="#A15606" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace">decide(cpu)</tspan></text>
<text x="415" y="126" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#6A6053">pure · O(1) · no I/O</text>
<rect x="630.5" y="86.5" width="179" height="51" fill="#FAF6EE" stroke="#D6CCBB" stroke-width="1"/>
<text x="720" y="108" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1C1712">Auto Scaling group</text>
<text x="720" y="126" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#6A6053">in service ⇄ warm pool</text>
<line x1="200" y1="112" x2="307" y2="112" stroke="#6A6053" stroke-width="1.25" marker-end="url(#am)"/>
<text x="255" y="105" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#6A6053">GetMetricData</text>
<line x1="520" y1="112" x2="627" y2="112" stroke="#A15606" stroke-width="1.5" marker-end="url(#aa)"/>
<text x="575" y="105" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#A15606">PutWarmPool</text>
<text x="575" y="128" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#6A6053">if changed</text>
<path d="M720.0 138V154H477.0M353.0 154H110.0V141" fill="none" stroke="#6A6053" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#am)"/>
<text x="415" y="158" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#6A6053">CPUUtilization</text>
<text x="20" y="177" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.54" fill="#6A6053">PHASE, CHOSEN FROM ONE NUMBER</text>
<rect x="20" y="187" width="158" height="6" fill="#28783C"/>
<rect x="179" y="187" width="157" height="6" fill="#A15606"/>
<rect x="337" y="187" width="473" height="6" fill="#B93A2B"/>
<text x="20" y="207" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#6A6053">0%</text>
<text x="178" y="207" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#6A6053">20%</text>
<line x1="178" y1="183" x2="178" y2="197" stroke="#1C1712" stroke-width="1.25"/>
<text x="336" y="207" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#6A6053">40%</text>
<line x1="336" y1="183" x2="336" y2="197" stroke="#1C1712" stroke-width="1.25"/>
<text x="810" y="207" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="11" text-anchor="end" fill="#6A6053">100%</text>
<text x="20" y="227" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#28783C">COST_SAVING</text>
<rect x="112.5" y="217" width="11" height="11" fill="#28783C"/>
<text x="20" y="243" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6A6053">drain the pool</text>
<text x="188" y="227" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#A15606">PRE_WARM</text>
<rect x="258" y="217" width="11" height="11" fill="#A15606"/>
<rect x="273.6" y="217.6" width="9.8" height="9.8" fill="none" stroke="#A15606" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
<rect x="288.6" y="217.6" width="9.8" height="9.8" fill="none" stroke="#A15606" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
<text x="188" y="243" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6A6053">boot 2 off-traffic</text>
<text x="346" y="227" font-family="ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#B93A2B">MITIGATE</text>
<rect x="416" y="217" width="11" height="11" fill="#B93A2B"/>
<rect x="431" y="217" width="11" height="11" fill="#B93A2B"/>
<rect x="446.6" y="217.6" width="9.8" height="9.8" fill="none" stroke="#B93A2B" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
<rect x="461.6" y="217.6" width="9.8" height="9.8" fill="none" stroke="#B93A2B" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
<text x="346" y="243" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6A6053">pull warm into service, re-prepare behind</text>
<rect x="634" y="218" width="9" height="9" fill="#6A6053"/>
<text x="650" y="227" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6A6053">in service</text>
<rect x="634.6" y="234.6" width="7.8" height="7.8" fill="none" stroke="#6A6053" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
<text x="650" y="243" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6A6053">warm, stopped (EBS only)</text>
</svg>
